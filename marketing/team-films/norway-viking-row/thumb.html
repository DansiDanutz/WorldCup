<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1280px; height: 720px; overflow: hidden; background: #000; font-family: "Inter", system-ui, sans-serif; }
  #wrap { position: relative; width: 1280px; height: 720px; }
  img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,0.62) 0%, rgba(0,0,0,0.28) 34%, transparent 55%); }
  .shadeB { position: absolute; left: 0; right: 0; bottom: 0; height: 34%; background: linear-gradient(180deg, transparent, rgba(0,0,0,0.55)); }
  .block { position: absolute; left: 54px; top: 50%; transform: translateY(-50%); }
  .kicker { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
  .flag { width: 66px; height: 48px; border-radius: 6px; position: relative; overflow: hidden; background: #ba0c2f; box-shadow: 0 6px 18px rgba(0,0,0,0.6); }
  .flag .wv { position: absolute; left: 34%; top: 0; bottom: 0; width: 18%; background: #fff; }
  .flag .wh { position: absolute; left: 0; right: 0; top: 36%; height: 28%; background: #fff; }
  .flag .bv { position: absolute; left: 38%; top: 0; bottom: 0; width: 10%; background: #00205b; }
  .flag .bh { position: absolute; left: 0; right: 0; top: 42%; height: 16%; background: #00205b; }
  .kt { font-weight: 900; font-size: 44px; letter-spacing: 0.16em; color: #fff; text-shadow: 0 3px 16px rgba(0,0,0,0.9); }
  .ro { font-weight: 900; font-size: 190px; line-height: 0.92; color: #fff; letter-spacing: 0.01em;
        text-shadow: 0 0 70px rgba(186,12,47,0.95), 0 10px 34px rgba(0,0,0,0.9);
        -webkit-text-stroke: 6px #ba0c2f; }
  .sub { margin-top: 20px; display: inline-block; font-weight: 900; font-size: 40px; letter-spacing: 0.14em;
         color: #0b0e14; background: #ffd24a; padding: 12px 26px; border-radius: 10px;
         box-shadow: 0 10px 30px rgba(0,0,0,0.65); }
</style>
</head>
<body>
<div id="wrap">
  <img class="bg" src="thumb_base.png" />
  <div class="shade"></div>
  <div class="shadeB"></div>
  <div class="block">
    <div class="kicker">
      <div class="flag"><div class="wv"></div><div class="wh"></div><div class="bv"></div><div class="bh"></div></div>
      <div class="kt">NORWAY</div>
    </div>
    <div class="ro">RO!<br/>RO!</div>
    <div class="sub">THE VIKING ROW</div>
  </div>
</div>
</body>
</html>
