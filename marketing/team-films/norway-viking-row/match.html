<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WorldCup26 Bonus — Norway: The Viking Row</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #050608; }
  #root { position: fixed; inset: 0; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root" data-screen-label="WC26 Norway Viking Row · t=0s"></div>

<!-- React + Babel vendored locally so the render never depends on a CDN -->
<script src="vendor/react.js"></script>
<script src="vendor/react-dom.js"></script>
<script src="vendor/babel.js"></script>

<script type="text/babel" src="animations.jsx"></script>
<script type="text/babel" src="match-kit.jsx"></script>
<script type="text/babel" src="match-scenes.jsx"></script>

<script type="text/babel">
const { useEffect } = React;

// Scene timeline (global seconds) — 100s. Kept in sync with narration.json
// (Brian VO slots) and clips.json (clip windows + chant audio placements).
const SCENES = [
  { c: SceneColdOpen,     start: 0,    end: 8.0 },    // stadium breathes — "that is Norway"
  { c: SceneHorn,         start: 8.0,  end: 16.0 },   // the Gjallarhorn sounds
  { c: SceneRow,          start: 16.0, end: 24.0 },   // the Viking Row begins — RO! RO!
  { c: SceneHaaland,      start: 24.0, end: 32.0 },   // Haaland
  { c: SceneBurstDrummer, start: 32.0, end: 36.0 },   // chant burst — drummer
  { c: SceneOdegaard,     start: 36.0, end: 44.0 },   // Ødegaard
  { c: SceneBurstFlags,   start: 44.0, end: 48.0 },   // chant burst — flags
  { c: SceneNusa,         start: 48.0, end: 56.0 },   // Nusa
  { c: SceneBurstFamily,  start: 56.0, end: 60.0 },   // chant burst — family
  { c: SceneSorloth,      start: 60.0, end: 68.0 },   // Sørloth
  { c: SceneBurstFlares,  start: 68.0, end: 72.0 },   // chant burst — flares
  { c: SceneBerge,        start: 72.0, end: 80.0 },   // Berge
  { c: SceneCelebration,  start: 80.0, end: 88.0 },   // they rowed past Brazil (real)
  { c: SceneFinale,       start: 88.0, end: 94.0 },   // the longship sails on
  { c: SceneCTA,          start: 94.0, end: 100.0 },  // worldcup26.world — free, no prizes
];

// Cinematic cut treatment per scene boundary (read by TransitionLayer).
window.MV_TRANSITIONS = [
  { at: 8.0,  type: 'dip' },
  { at: 16.0, type: 'flash' },
  { at: 24.0, type: 'flash' },
  { at: 32.0, type: 'flash' },
  { at: 36.0, type: 'flash' },
  { at: 44.0, type: 'flash' },
  { at: 48.0, type: 'flash' },
  { at: 56.0, type: 'flash' },
  { at: 60.0, type: 'flash' },
  { at: 68.0, type: 'flash' },
  { at: 72.0, type: 'flash' },
  { at: 80.0, type: 'flash' },
  { at: 88.0, type: 'dip' },
  { at: 94.0, type: 'dip' },
];
const DURATION = 100.0;

function ScreenLabeler() {
  const time = useTime();
  useEffect(() => {
    const root = document.getElementById('root');
    if (root) root.dataset.screenLabel = `WC26 Norway Viking Row · t=${Math.floor(time)}s`;
  }, [Math.floor(time)]);
  return null;
}

function SeekBridge() {
  const tl = useTimeline();
  useEffect(() => {
    window.__seek = (t) => { tl.setPlaying(false); tl.setTime(t); };
  }, [tl.setTime, tl.setPlaying]);
  return null;
}

function MatchVideo() {
  return (
    <Stage width={1920} height={1080} duration={DURATION} background="#050608" persistKey="wc26norwayrow">
      <ScreenLabeler />
      <SeekBridge />
      {SCENES.map((s, i) => (
        <Sprite key={i} start={s.start} end={s.end}>
          <s.c />
        </Sprite>
      ))}
      <TransitionLayer />
    </Stage>
  );
}

function boot() {
  ReactDOM.createRoot(document.getElementById('root')).render(<MatchVideo />);
}
// Load clip placements first so any clip lookups + mux can never drift apart.
fetch('./clips.json')
  .then((r) => r.json())
  .then((d) => { window.MV_CLIPS = d.clips || []; })
  .catch((e) => { console.warn('clips.json load failed', e); window.MV_CLIPS = []; })
  .finally(boot);
</script>
</body>
</html>
