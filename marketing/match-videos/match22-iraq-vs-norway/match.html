<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WorldCup26 Legends — Match 22: Iraq vs Norway</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #050608; }
  #root { position: fixed; inset: 0; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root" data-screen-label="WC26 Match 22 · t=0s"></div>

<!-- React + Babel (pinned, same stack as the worldcup26 ad) -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<script type="text/babel" src="animations.jsx"></script>
<script type="text/babel" src="match-kit.jsx"></script>
<script type="text/babel" src="match-scenes.jsx"></script>

<script type="text/babel">
const { useEffect } = React;

// Scene timeline (global seconds) — 300s. Kept in sync with narration.json
// (Brian VO slots) and clips.json (music/SFX placements).
const SCENES = [
  { c: SceneColdOpen, start: 0,     end: 16.0 },   // Iraq 2007 war-torn triumph — "one team, one flag"
  { c: SceneTitle,    start: 16.0,  end: 30.0 },   // recap (FRA 2-1 SEN, our prediction) + Ep.22 title card
  { c: SceneTease,    start: 30.0,  end: 50.0 },   // "the most powerful story in football"
  { c: SceneHistory,  start: 50.0,  end: 122.0 },  // the true 2007 AFC Asian Cup triumph
  { c: SceneIraq,     start: 122.0, end: 165.0 },  // Lions of Mesopotamia line-up
  { c: SceneNorway,   start: 165.0, end: 206.0 },  // the Vikings line-up
  { c: SceneDuel,     start: 206.0, end: 222.0 },  // heart vs power
  { c: SceneDrama,    start: 222.0, end: 262.0 },  // OUR PREDICTION 1-1 (Haaland 1-0, Hussein 1-1) + verdict
  { c: SceneMystery,  start: 262.0, end: 280.0 },  // Legend 022 — the Standard-Bearer
  { c: SceneApp,      start: 280.0, end: 294.0 },  // worldcup26.world
  { c: SceneCTA,      start: 294.0, end: 300.0 },  // like / subscribe outro
];

// Cinematic cut treatment per scene boundary (read by TransitionLayer).
window.MV_TRANSITIONS = [
  { at: 16.0,  type: 'flash' },
  { at: 30.0,  type: 'flash' },
  { at: 50.0,  type: 'dip' },
  { at: 122.0, type: 'flash' },
  { at: 165.0, type: 'flash' },
  { at: 206.0, type: 'dip' },
  { at: 262.0, type: 'dip' },
  { at: 280.0, type: 'flash' },
  { at: 294.0, type: 'flash' },
];
const DURATION = 300.0;

function ScreenLabeler() {
  const time = useTime();
  useEffect(() => {
    const root = document.getElementById('root');
    if (root) root.dataset.screenLabel = `WC26 Match 22 · t=${Math.floor(time)}s`;
  }, [Math.floor(time)]);
  return null;
}

function SeekBridge() {
  const tl = useTimeline();
  useEffect(() => {
    window.__seek = (t) => { tl.setPlaying(false); tl.setTime(t); };
  }, [tl.setTime, tl.setPlaying]);
  return null;
}

function MatchVideo() {
  return (
    <Stage width={1920} height={1080} duration={DURATION} background="#050608" persistKey="wc26m22">
      <ScreenLabeler />
      <SeekBridge />
      {SCENES.map((s, i) => (
        <Sprite key={i} start={s.start} end={s.end}>
          <s.c />
        </Sprite>
      ))}
      <TransitionLayer />
    </Stage>
  );
}

function boot() {
  ReactDOM.createRoot(document.getElementById('root')).render(<MatchVideo />);
}
// Load clip placements first so any clip lookups + mux can never drift apart.
fetch('./clips.json')
  .then((r) => r.json())
  .then((d) => { window.MV_CLIPS = d.clips || []; })
  .catch((e) => { console.warn('clips.json load failed', e); window.MV_CLIPS = []; })
  .finally(boot);
</script>
</body>
</html>
