<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WorldCup26 Legends — Match 19: Saudi Arabia vs Uruguay</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #050608; }
  #root { position: fixed; inset: 0; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root" data-screen-label="WC26 Match 19 · t=0s"></div>

<!-- React + Babel (pinned, same stack as the worldcup26 ad) -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<script type="text/babel" src="animations.jsx"></script>
<script type="text/babel" src="match-kit.jsx"></script>
<script type="text/babel" src="match-scenes.jsx"></script>

<script type="text/babel">
const { useEffect } = React;

// Scene timeline (global seconds) — 300s. Kept in sync with narration.json
// (Brian VO slots) and clips.json (music/SFX placements).
const SCENES = [
  { c: SceneColdOpen, start: 0,     end: 18.0 },   // Maracanazo 1950 — "they silenced 200,000"
  { c: SceneTitle,    start: 18.0,  end: 30.0 },   // Ep18 recap line + Ep.19 title card
  { c: SceneTease,    start: 30.0,  end: 48.0 },   // smallest giant + "a man who heard the silence"
  { c: SceneHistory,  start: 48.0,  end: 118.0 },  // 1930 first WC + the Maracanazo (the heart)
  { c: SceneSaudi,    start: 118.0, end: 158.0 },  // the Green Falcons line-up
  { c: SceneUruguay,  start: 158.0, end: 194.0 },  // La Celeste line-up
  { c: SceneDuel,     start: 194.0, end: 201.0 },  // giant-killers vs smallest giant
  { c: SceneDrama,    start: 201.0, end: 250.0 },  // OUR PREDICTION 1-2 (Al-Dawsari, Nunez, Araujo)
  { c: SceneVerdict,  start: 250.0, end: 261.0 },  // do you agree? GREEN FALCONS / CELESTE
  { c: SceneMystery,  start: 261.0, end: 280.0 },  // Legend 019 — the Ghost of the Maracana
  { c: SceneApp,      start: 280.0, end: 290.0 },  // worldcup26.world
  { c: SceneCTA,      start: 290.0, end: 300.0 },  // like / subscribe outro
];

// Cinematic cut treatment per scene boundary (read by TransitionLayer).
window.MV_TRANSITIONS = [
  { at: 18.0,  type: 'flash' },
  { at: 30.0,  type: 'flash' },
  { at: 48.0,  type: 'dip' },
  { at: 118.0, type: 'flash' },
  { at: 158.0, type: 'flash' },
  { at: 194.0, type: 'flash' },
  { at: 201.0, type: 'dip' },
  { at: 250.0, type: 'dip' },
  { at: 261.0, type: 'dip' },
  { at: 280.0, type: 'flash' },
  { at: 290.0, type: 'flash' },
];
const DURATION = 300.0;

function ScreenLabeler() {
  const time = useTime();
  useEffect(() => {
    const root = document.getElementById('root');
    if (root) root.dataset.screenLabel = `WC26 Match 19 · t=${Math.floor(time)}s`;
  }, [Math.floor(time)]);
  return null;
}

function SeekBridge() {
  const tl = useTimeline();
  useEffect(() => {
    window.__seek = (t) => { tl.setPlaying(false); tl.setTime(t); };
  }, [tl.setTime, tl.setPlaying]);
  return null;
}

function MatchVideo() {
  return (
    <Stage width={1920} height={1080} duration={DURATION} background="#050608" persistKey="wc26m19">
      <ScreenLabeler />
      <SeekBridge />
      {SCENES.map((s, i) => (
        <Sprite key={i} start={s.start} end={s.end}>
          <s.c />
        </Sprite>
      ))}
      <TransitionLayer />
    </Stage>
  );
}

function boot() {
  ReactDOM.createRoot(document.getElementById('root')).render(<MatchVideo />);
}
// Load clip placements first so any clip lookups + mux can never drift apart.
fetch('./clips.json')
  .then((r) => r.json())
  .then((d) => { window.MV_CLIPS = d.clips || []; })
  .catch((e) => { console.warn('clips.json load failed', e); window.MV_CLIPS = []; })
  .finally(boot);
</script>
</body>
</html>
