<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WorldCup26 Legends — Ep43: Argentina vs Austria</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #050608; }
  #root { position: fixed; inset: 0; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root" data-screen-label="WC26 Ep43 · t=0s"></div>

<!-- React + Babel (pinned, same stack as the worldcup26 ad) -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<script type="text/babel" src="animations.jsx"></script>
<script type="text/babel" src="match-kit.jsx"></script>
<script type="text/babel" src="match-scenes.jsx"></script>

<script type="text/babel">
const { useEffect } = React;

// Scene timeline (global seconds) — 300s. Keep in sync with narration.json
// (VO slots) and clips.json (video clip placements).
const SCENES = [
  { c: SceneColdOpen, start: 0.00, end: 16.24 },
  { c: SceneTitle, start: 16.24, end: 29.73 },
  { c: SceneStadium, start: 29.73, end: 44.00 },
  { c: SceneHistory, start: 44.00, end: 98.50 },
  { c: SceneArgentina, start: 98.50, end: 133.50 },
  { c: SceneAustria, start: 133.50, end: 171.16 },
  { c: SceneDuel, start: 171.16, end: 186.00 },
  { c: SceneDrama, start: 186.00, end: 242.00 },
  { c: SceneVerdict, start: 242.00, end: 259.48 },
  { c: SceneMystery, start: 259.48, end: 278.93 },
  { c: SceneApp, start: 278.93, end: 293.80 },
  { c: SceneCTA, start: 293.80, end: 307.24 },
];

// Cinematic cut treatment per scene boundary (read by TransitionLayer).
window.MV_TRANSITIONS = [
  { at: 16.0,  type: 'flash' },
  { at: 28.0,  type: 'flash' },
  { at: 44.0,  type: 'dip' },
  { at: 98.5,  type: 'flash' },
  { at: 133.5, type: 'flash' },
  { at: 164.5, type: 'flash' },
  { at: 186.0, type: 'dip' },
  { at: 242.0, type: 'dip' },
  { at: 256.0, type: 'dip' },
  { at: 270.0, type: 'flash' },
  { at: 288.0, type: 'flash' },
];
const DURATION = 307.24;

function ScreenLabeler() {
  const time = useTime();
  useEffect(() => {
    const root = document.getElementById('root');
    if (root) root.dataset.screenLabel = `WC26 Ep43 · t=${Math.floor(time)}s`;
  }, [Math.floor(time)]);
  return null;
}

function SeekBridge() {
  const tl = useTimeline();
  useEffect(() => {
    window.__seek = (t) => { tl.setPlaying(false); tl.setTime(t); };
  }, [tl.setTime, tl.setPlaying]);
  return null;
}

function MatchVideo() {
  return (
    <Stage width={1920} height={1080} duration={DURATION} background="#050608" persistKey="wc26ep43">
      <ScreenLabeler />
      <SeekBridge />
      {SCENES.map((s, i) => (
        <Sprite key={i} start={s.start} end={s.end}>
          <s.c />
        </Sprite>
      ))}
      <TransitionLayer />
    </Stage>
  );
}

function boot() {
  ReactDOM.createRoot(document.getElementById('root')).render(<MatchVideo />);
}
// Load clip placements first so ClipSprite/mux can never drift apart.
fetch('./clips.json')
  .then((r) => r.json())
  .then((d) => { window.MV_CLIPS = d.clips || []; })
  .catch((e) => { console.warn('clips.json load failed', e); window.MV_CLIPS = []; })
  .finally(boot);
</script>
</body>
</html>
