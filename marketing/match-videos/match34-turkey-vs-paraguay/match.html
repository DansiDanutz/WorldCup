<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WorldCup26 Legends — Match 23: Austria vs Jordan</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #050608; }
  #root { position: fixed; inset: 0; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root" data-screen-label="WC26 Match 23 · t=0s"></div>

<!-- React + Babel (pinned, same stack as the worldcup26 ad) -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<script type="text/babel" src="animations.jsx"></script>
<script type="text/babel" src="match-kit.jsx"></script>
<script type="text/babel" src="match-scenes.jsx"></script>

<script type="text/babel">
const { useEffect } = React;

// Scene timeline (global seconds) — 300s. Kept in sync with narration.json
// (Brian VO slots) and clips.json (music/SFX placements).
const SCENES = [
  { c: SceneColdOpen, start: 0,     end: 16.0 },   // the Eleven-Second Ghost
  { c: SceneTitle,    start: 16.0,  end: 28.0 },   // Ep33 recap (SCO 0-0 MAR) + Ep.34 title card
  { c: SceneTease,    start: 28.0,  end: 46.5 },   // Fire vs Steel
  { c: SceneHistory,  start: 46.5,  end: 150.0 },  // Turkey 2002 fastest goal + Paraguay's steel
  { c: SceneTurkey,   start: 150.0, end: 178.0 },  // Turkey line-up — the Crescent
  { c: SceneParaguay, start: 178.0, end: 195.0 },  // Paraguay line-up — La Albirroja
  { c: SceneDuel,     start: 195.0, end: 213.0 },  // Turkish fire vs Paraguayan steel
  { c: SceneDrama,    start: 213.0, end: 256.0 },  // OUR PREDICTION 2-1 (Guler 1-0, Enciso 1-1, Yildiz 2-1)
  { c: SceneVerdict,  start: 256.0, end: 266.0 },  // do you agree? TURKEY / PARAGUAY
  { c: SceneMystery,  start: 266.0, end: 284.0 },  // Legend 034 — the Eleven-Second Ghost
  { c: SceneApp,      start: 284.0, end: 292.0 },  // worldcup26.world
  { c: SceneCTA,      start: 292.0, end: 300.0 },  // like / subscribe outro
];

// Cinematic cut treatment per scene boundary (read by TransitionLayer).
window.MV_TRANSITIONS = [
  { at: 16.0,  type: 'flash' },
  { at: 28.0,  type: 'flash' },
  { at: 46.5,  type: 'dip' },
  { at: 150.0, type: 'flash' },
  { at: 178.0, type: 'flash' },
  { at: 195.0, type: 'flash' },
  { at: 213.0, type: 'dip' },
  { at: 256.0, type: 'dip' },
  { at: 266.0, type: 'dip' },
  { at: 284.0, type: 'flash' },
  { at: 292.0, type: 'flash' },
];
const DURATION = 300.0;

function ScreenLabeler() {
  const time = useTime();
  useEffect(() => {
    const root = document.getElementById('root');
    if (root) root.dataset.screenLabel = `WC26 Match 23 · t=${Math.floor(time)}s`;
  }, [Math.floor(time)]);
  return null;
}

function SeekBridge() {
  const tl = useTimeline();
  useEffect(() => {
    window.__seek = (t) => { tl.setPlaying(false); tl.setTime(t); };
  }, [tl.setTime, tl.setPlaying]);
  return null;
}

function MatchVideo() {
  return (
    <Stage width={1920} height={1080} duration={DURATION} background="#050608" persistKey="wc26m23">
      <ScreenLabeler />
      <SeekBridge />
      {SCENES.map((s, i) => (
        <Sprite key={i} start={s.start} end={s.end}>
          <s.c />
        </Sprite>
      ))}
      <TransitionLayer />
    </Stage>
  );
}

function boot() {
  ReactDOM.createRoot(document.getElementById('root')).render(<MatchVideo />);
}
// Load clip placements first so any clip lookups + mux can never drift apart.
fetch('./clips.json')
  .then((r) => r.json())
  .then((d) => { window.MV_CLIPS = d.clips || []; })
  .catch((e) => { console.warn('clips.json load failed', e); window.MV_CLIPS = []; })
  .finally(boot);
</script>
</body>
</html>
