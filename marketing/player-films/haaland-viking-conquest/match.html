<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WorldCup26 Bonus — Erling Haaland: The Viking Returns</title>
<style>
  @font-face { font-family: 'Inter'; font-style: normal; font-weight: 100 900; font-display: swap; src: url('vendor/inter-latin.woff2') format('woff2'); }
</style>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #050608; }
  #root { position: fixed; inset: 0; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root" data-screen-label="WC26 Bonus Haaland · t=0s"></div>

<!-- React + Babel (pinned, same stack as the worldcup26 ad) -->
<script src="vendor/react.development.js"></script>
<script src="vendor/react-dom.development.js"></script>
<script src="vendor/babel.min.js"></script>

<script type="text/babel" src="animations.jsx"></script>
<script type="text/babel" src="match-kit.jsx"></script>
<script type="text/babel" src="match-scenes.jsx"></script>

<script type="text/babel">
const { useEffect } = React;

// Scene timeline (global seconds) — 300s. Kept in sync with narration.json
// (Brian VO slots) and clips.json (music/SFX placements).
const SCENES = [
  { c: FilmHaaland, start: 0, end: 300.0 },   // "WorldCup26 Bonus — Erling Haaland": Viking-saga drama film
];

// Cinematic cut treatment per scene boundary (read by TransitionLayer).
window.MV_TRANSITIONS = [
  { at: 23.0,  type: 'dip' },
  { at: 38.5,  type: 'flash' },
  { at: 58.5,  type: 'dip' },
  { at: 98.5,  type: 'flash' },
  { at: 123.0, type: 'flash' },
  { at: 142.0, type: 'flash' },
  { at: 168.3, type: 'dip' },
  { at: 192.8, type: 'flash' },
  { at: 214.5, type: 'dip' },
  { at: 242.5, type: 'flash' },
  { at: 257.5, type: 'flash' },
  { at: 283.0, type: 'dip' },
];
const DURATION = 300.0;

function ScreenLabeler() {
  const time = useTime();
  useEffect(() => {
    const root = document.getElementById('root');
    if (root) root.dataset.screenLabel = `WC26 Bonus Haaland · t=${Math.floor(time)}s`;
  }, [Math.floor(time)]);
  return null;
}

function SeekBridge() {
  const tl = useTimeline();
  useEffect(() => {
    window.__seek = (t) => { tl.setPlaying(false); tl.setTime(t); };
  }, [tl.setTime, tl.setPlaying]);
  return null;
}

function MatchVideo() {
  return (
    <Stage width={1920} height={1080} duration={DURATION} background="#050608" persistKey="wc26haaland">
      <ScreenLabeler />
      <SeekBridge />
      {SCENES.map((s, i) => (
        <Sprite key={i} start={s.start} end={s.end}>
          <s.c />
        </Sprite>
      ))}
      <TransitionLayer />
    </Stage>
  );
}

function boot() {
  ReactDOM.createRoot(document.getElementById('root')).render(<MatchVideo />);
}
// Load clip placements first so any clip lookups + mux can never drift apart.
fetch('./clips.json')
  .then((r) => r.json())
  .then((d) => { window.MV_CLIPS = d.clips || []; })
  .catch((e) => { console.warn('clips.json load failed', e); window.MV_CLIPS = []; })
  .finally(boot);
</script>
</body>
</html>
