<!doctype html>
<!-- Brand number/record card renderer (frame-exact via window.__setT).
     Query: ?spec=<urlencoded JSON of one cards-spec entry>
     Brand: WorldCup26 dark #07090f · green #106b4f · gold #ffd24a · Inter stack.
     Labels only — never sentences (hard rule #10). No FIFA marks (non-affiliation). -->
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#07090f}
  #stage{position:absolute;inset:0;font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
</style></head><body><div id="stage"></div><script>
const BRAND={bg:'#07090f',green:'#106b4f',gold:'#ffd24a',text:'#f4f6fa',muted:'#93a0b4',red:'#d21034'};
const spec=JSON.parse(new URLSearchParams(location.search).get('spec'));
const accent=spec.accent==='red'?BRAND.red:BRAND.gold;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const easeOutCubic=p=>1-Math.pow(1-p,3);
const easeOutBack=p=>{const c=1.70158;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2)};
function fmt(v){
  const f=spec.format||'#';
  if(f==='comma') return Math.round(v).toLocaleString('en-US');
  if(f==='$#M')   return '$'+Math.round(v)+'M';
  if(f==='#.#s')  return v.toFixed(1)+'s';
  return String(Math.round(v));
}
const stage=document.getElementById('stage');
function render(t){
  const el=[];
  // backdrop: deep gradient + green floor glow + drifting gold particles + vignette
  el.push(`<div style="position:absolute;inset:0;background:
    radial-gradient(1200px 700px at 50% 118%, ${BRAND.green}33 0%, transparent 60%),
    radial-gradient(1400px 900px at 50% -30%, #14203a55 0%, transparent 65%),
    linear-gradient(180deg,#0a0e18 0%,#07090f 60%,#05070b 100%)"></div>`);
  for(let i=0;i<26;i++){const s1=(i*2654435761%1000)/1000,s2=(i*1597334677%1000)/1000;
    const x=(s1*1920+Math.sin(t*(.22+s2*.35)+i)*55)%1920;
    const y=1080-((t*(11+s2*22))+s2*1080)%1140+30;
    const o=.05+.22*s2*(0.6+0.4*Math.sin(t*1.2+i));
    el.push(`<div style="position:absolute;left:${x}px;top:${y}px;width:${3+s2*6}px;height:${3+s2*6}px;border-radius:50%;background:rgba(255,210,74,${o.toFixed(3)});filter:blur(1px)"></div>`);}
  // gold frame lines
  const lineP=easeOutCubic(clamp(t/0.9,0,1));
  el.push(`<div style="position:absolute;left:50%;top:150px;transform:translateX(-50%);width:${lineP*560}px;height:3px;background:linear-gradient(90deg,transparent,${accent},transparent)"></div>`);
  el.push(`<div style="position:absolute;left:50%;bottom:150px;transform:translateX(-50%);width:${lineP*560}px;height:3px;background:linear-gradient(90deg,transparent,${accent},transparent)"></div>`);

  const kickP=easeOutCubic(clamp((t-0.25)/0.7,0,1));
  const mainP=easeOutBack(clamp((t-0.7)/0.9,0,1));
  const subP =easeOutCubic(clamp((t-1.7)/0.8,0,1));
  const pulse=1+0.008*Math.sin(Math.max(0,t-2.2)*2.4);

  if(spec.type==='number'){
    const cp=easeOutCubic(clamp((t-0.7)/1.8,0,1));
    const val=fmt((spec.countTo||0)*cp);
    el.push(`<div style="position:absolute;left:0;right:0;top:236px;text-align:center;opacity:${kickP};transform:translateY(${(1-kickP)*30}px);font-weight:800;font-size:44px;letter-spacing:.42em;color:${BRAND.muted}">${spec.label||''}</div>`);
    el.push(`<div style="position:absolute;left:0;right:0;top:330px;text-align:center;opacity:${clamp(mainP,0,1)};transform:scale(${(0.75+0.25*clamp(mainP,0,1.15))*pulse});font-weight:900;font-size:300px;line-height:1;color:${accent};text-shadow:0 0 90px ${accent}55,0 10px 40px rgba(0,0,0,.85)">${val}</div>`);
    if(spec.stars){let s='';for(let i=0;i<spec.stars;i++){const sp=easeOutBack(clamp((t-1.4-i*0.28)/0.5,0,1));s+=`<span style="display:inline-block;margin:0 14px;transform:scale(${clamp(sp,0,1.2)});opacity:${clamp(sp,0,1)};color:${BRAND.gold};font-size:74px;text-shadow:0 0 40px ${BRAND.gold}66">★</span>`;}
      el.push(`<div style="position:absolute;left:0;right:0;top:680px;text-align:center">${s}</div>`);}
    if(spec.sub) el.push(`<div style="position:absolute;left:0;right:0;top:${spec.stars?790:730}px;text-align:center;opacity:${subP};transform:translateY(${(1-subP)*24}px);font-weight:800;font-size:52px;letter-spacing:.18em;color:${BRAND.text}">${spec.sub}</div>`);
  }
  if(spec.type==='rows'){
    el.push(`<div style="position:absolute;left:0;right:0;top:200px;text-align:center;opacity:${kickP};font-weight:800;font-size:46px;letter-spacing:.42em;color:${BRAND.muted}">${spec.label||''}</div>`);
    const rows=spec.rows||[],step=spec.slow?1.15:0.55,rh=rows.length>4?128:150,y0=rows.length>4?318:(rows.length===3?368:400);
    rows.forEach((r,i)=>{const p=easeOutBack(clamp((t-0.8-i*step)/0.6,0,1));const [a,b]=r.split(' — ');
      el.push(`<div style="position:absolute;left:50%;top:${y0+i*rh}px;transform:translateX(-50%) translateY(${(1-clamp(p,0,1))*40}px);opacity:${clamp(p,0,1)};width:1180px;display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid rgba(255,255,255,.14);padding:0 30px 16px">
        <span style="font-weight:900;font-size:86px;color:${accent};text-shadow:0 0 50px ${accent}44">${a}</span>
        <span style="font-weight:800;font-size:50px;letter-spacing:.1em;color:${BRAND.text}">${b||''}</span></div>`);});
  }
  if(spec.type==='title'){
    const topY=spec.lower?300:270;
    el.push(`<div style="position:absolute;left:0;right:0;top:${topY}px;text-align:center;opacity:${kickP};transform:translateY(${(1-kickP)*30}px);font-weight:800;font-size:48px;letter-spacing:.46em;color:${accent}">${spec.kicker||''}</div>`);
    const chars=[...(spec.main||'')];const mid=[];
    chars.forEach((ch,i)=>{const p=easeOutBack(clamp((t-0.7-i*0.05)/0.5,0,1));
      mid.push(`<span style="display:inline-block;white-space:pre;opacity:${clamp(p,0,1)};transform:translateY(${(1-clamp(p,0,1))*66}px) scale(${0.6+0.4*clamp(p,0,1)});">${ch===' '?'&nbsp;':ch}</span>`);});
    const fs=(spec.main||'').length>14?128:200;
    el.push(`<div style="position:absolute;left:0;right:0;top:${topY+120}px;text-align:center;font-weight:900;font-size:${fs}px;line-height:1.05;color:${BRAND.text};text-shadow:0 0 70px ${accent}44,0 8px 34px rgba(0,0,0,.85)">${mid.join('')}</div>`);
    if(spec.sub) el.push(`<div style="position:absolute;left:0;right:0;top:${topY+120+fs+90}px;text-align:center;opacity:${subP};transform:translateY(${(1-subP)*24}px);font-weight:800;font-size:46px;letter-spacing:.24em;color:${BRAND.muted}">${spec.sub}</div>`);
    const shineX=-30+clamp((t-1.8)/1.4,0,1)*160;
    el.push(`<div style="position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent ${shineX-9}%,rgba(255,255,255,.14) ${shineX}%,transparent ${shineX+9}%)"></div>`);
  }
  el.push(`<div style="position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)"></div>`);
  stage.innerHTML=el.join('');
}
window.__setT=t=>{render(t);return true;};
render(0);
</script></body></html>
