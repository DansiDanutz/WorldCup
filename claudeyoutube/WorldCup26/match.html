<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WorldCup26.world — What Football Left Behind (Milestone + FIFA Records)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #050608; }
  #root { position: fixed; inset: 0; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root" data-screen-label="WC26 Doc · t=0s"></div>

<!-- React + Babel (pinned, same stack as every episode) -->
<script src="vendor/react.development.js" crossorigin="anonymous"></script>
<script src="vendor/react-dom.development.js" crossorigin="anonymous"></script>
<script src="vendor/babel.min.js" crossorigin="anonymous"></script>

<script type="text/babel" src="animations.jsx"></script>
<script type="text/babel" src="match-kit.jsx"></script>
<script type="text/babel" src="match-scenes.jsx"></script>

<script type="text/babel">
const { useEffect } = React;

// Scene timeline (global seconds) — 1470s documentary. Windows must match the
// chapter map in README.md, narration.json (VO slots) and clips.json (clips).
const SCENES = [
  { c: SceneColdOpen,   start: 0,     end: 74.0 },
  { c: SceneBuilt,      start: 74.0,  end: 242.0 },
  { c: SceneThanks,     start: 242.0, end: 388.0 },
  { c: SceneMoney,      start: 388.0, end: 611.0 },
  { c: SceneRecords,    start: 611.0, end: 832.0 },
  { c: SceneGreatest,   start: 832.0, end: 992.0 },
  { c: SceneLeaves,     start: 992.0, end: 1331.0 },
  { c: SceneClose,      start: 1331.0,end: 1470.0 },
];

// Broadcast chapter bar (retention: viewers see the journey ahead).
window.MV_CHAPTERS = [
  { label: 'THE FINAL WHISTLE', at: 0 },
  { label: 'WHAT WE BUILT', at: 74 },
  { label: 'THANK YOU · 14K', at: 242 },
  { label: 'THE MONEY', at: 388 },
  { label: 'THE RECORDS', at: 611 },
  { label: 'THE GREATEST', at: 832 },
  { label: 'WHAT REMAINS', at: 992 },
  { label: 'WE CONTINUE', at: 1331 },
];

// Cinematic cut treatment per chapter boundary (read by TransitionLayer).
window.MV_TRANSITIONS = [
  { at: 74.0,   type: 'dip' },
  { at: 242.0,  type: 'dip' },
  { at: 388.0,  type: 'dip' },
  { at: 611.0,  type: 'dip' },
  { at: 832.0,  type: 'dip' },
  { at: 992.0,  type: 'dip' },
  { at: 1331.0, type: 'dip' },
];
const DURATION = 1470.0;

function ScreenLabeler() {
  const time = useTime();
  useEffect(() => {
    const root = document.getElementById('root');
    if (root) root.dataset.screenLabel = `WC26 Doc · t=${Math.floor(time)}s`;
  }, [Math.floor(time)]);
  return null;
}

function SeekBridge() {
  const tl = useTimeline();
  useEffect(() => {
    window.__seek = (t) => { tl.setPlaying(false); tl.setTime(t); };
  }, [tl.setTime, tl.setPlaying]);
  return null;
}

function MatchVideo() {
  return (
    <Stage width={1920} height={1080} duration={DURATION} background="#050608" persistKey="wc26doc">
      <ScreenLabeler />
      <SeekBridge />
      {SCENES.map((s, i) => (
        <Sprite key={i} start={s.start} end={s.end}>
          <s.c />
        </Sprite>
      ))}
      <TransitionLayer />
      <ChapterBar chapters={window.MV_CHAPTERS} />
    </Stage>
  );
}

function boot() {
  ReactDOM.createRoot(document.getElementById('root')).render(<MatchVideo />);
}
// Load clip placements first so ClipSprite/mux can never drift apart.
fetch('./clips.json')
  .then((r) => r.json())
  .then((d) => {
    window.MV_CLIPS = d.clips || [];
    // QA guard: every ClipSprite id used in scenes must exist (warns loudly)
    fetch('./match-scenes.jsx').then(r => r.text()).then(src => {
      const used = [...src.matchAll(/ClipSprite id="([^"]+)"/g)].map(m => m[1]);
      const known = new Set(window.MV_CLIPS.map(c => c.id));
      used.filter(id => !known.has(id)).forEach(id => console.error('MISSING CLIP ID:', id));
    });
  })
  .catch((e) => { console.warn('clips.json load failed', e); window.MV_CLIPS = []; })
  .finally(boot);
</script>
</body>
</html>
